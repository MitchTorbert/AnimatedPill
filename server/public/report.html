<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Report an issue - Animated Pill Generator</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png" />
<style>
  @font-face {
    font-family: "RoobertTWITCH";
    src: url("/fonts/RoobertTWITCH-Medium.otf");
    font-weight: 500;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0e0e10;
    color: #efeff1;
    min-height: 100vh;
    padding: 40px 20px 80px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-family: "RoobertTWITCH", sans-serif; font-weight: 500; font-size: 28px; margin: 0 0 6px; color: #bf94ff; }
  .intro { color: #adadb8; font-size: 15px; line-height: 1.5; margin: 0 0 28px; }
  label.field, .legend { display: block; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #adadb8; margin: 22px 0 8px; }
  .optional { text-transform: none; letter-spacing: 0; color: #6b6b76; }
  .radio { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 15px; cursor: pointer; }
  .radio input { accent-color: #9146FF; width: 16px; height: 16px; margin: 0; }
  input[type="text"], input[type="email"], textarea {
    width: 100%;
    background: #18181b;
    border: 1px solid #323239;
    border-radius: 6px;
    color: #efeff1;
    font: inherit;
    font-size: 15px;
    padding: 10px 12px;
  }
  input::placeholder, textarea::placeholder { color: #6b6b76; }
  input:focus, textarea:focus { outline: none; border-color: #9146FF; }
  textarea { min-height: 170px; resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 520px) { .row { grid-template-columns: 1fr; } }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .actions { display: flex; align-items: center; gap: 16px; margin-top: 28px; }
  button.send {
    background: #9146FF; color: #fff; border: none; border-radius: 6px;
    font: inherit; font-size: 14px; font-weight: 600; padding: 10px 20px; cursor: pointer;
  }
  button.send:hover { background: #772ce8; }
  button.send:disabled { opacity: 0.55; cursor: default; }
  .msg { font-size: 14px; color: #adadb8; }
  .msg.error { color: #ff8280; }
  .back { margin-top: 48px; font-size: 12px; text-align: center; }
  .back a { color: #6b6b76; text-decoration: none; }
  .back a:hover { color: #adadb8; text-decoration: underline; }
  .thanks { padding: 40px 0; text-align: center; }
  .thanks h2 { font-family: "RoobertTWITCH", sans-serif; font-weight: 500; font-size: 22px; margin: 0 0 8px; }
  .thanks p { color: #adadb8; margin: 0; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Report an issue</h1>
    <p class="intro">Found something broken, confusing, or missing? Tell us here and it goes straight to the team that builds this tool.</p>

    <form id="form" novalidate>
      <div class="legend">What is it?</div>
      <label class="radio"><input type="radio" name="type" value="bug" checked /> Something's broken</label>
      <label class="radio"><input type="radio" name="type" value="idea" /> An idea or request</label>
      <label class="radio"><input type="radio" name="type" value="question" /> A question</label>

      <label class="field" for="title">Title</label>
      <input type="text" id="title" maxlength="120" placeholder="Download button does nothing on my pill" />

      <label class="field" for="description">What happened?</label>
      <textarea id="description" maxlength="5000" placeholder="What you were doing, what you expected, and what happened instead."></textarea>

      <div class="row">
        <div>
          <label class="field" for="name">Name <span class="optional">(optional)</span></label>
          <input type="text" id="name" maxlength="100" autocomplete="name" />
        </div>
        <div>
          <label class="field" for="email">Email <span class="optional">(optional)</span></label>
          <input type="email" id="email" maxlength="200" autocomplete="email" />
        </div>
      </div>

      <div class="hp" aria-hidden="true">
        <label>Website <input type="text" id="website" tabindex="-1" autocomplete="off" /></label>
      </div>

      <div class="actions">
        <button type="submit" class="send" id="sendBtn">Send report</button>
        <span class="msg" id="msg"></span>
      </div>
    </form>

    <div class="thanks" id="thanks" hidden>
      <h2>Thanks - report sent.</h2>
      <p>The team will take a look.</p>
    </div>

    <div class="back"><a href="/">&larr; Back to the pill generator</a></div>
  </div>

<script>
  const form = document.getElementById("form");
  const msg = document.getElementById("msg");
  const sendBtn = document.getElementById("sendBtn");

  function browserInfo() {
    return {
      "User agent": navigator.userAgent,
      "Platform": navigator.userAgentData?.platform || navigator.platform || "",
      "Language": navigator.language,
      "Viewport": window.innerWidth + " x " + window.innerHeight,
      "Screen": screen.width + " x " + screen.height + " (" + window.devicePixelRatio + "x pixel ratio)",
      "Timezone": Intl.DateTimeFormat().resolvedOptions().timeZone,
    };
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.className = "msg";
    msg.textContent = "";
    const title = document.getElementById("title").value.trim();
    const description = document.getElementById("description").value.trim();
    if (!title || !description) {
      msg.className = "msg error";
      msg.textContent = "Please add a title and a description.";
      return;
    }
    sendBtn.disabled = true;
    msg.textContent = "Sending...";
    try {
      const res = await fetch("/api/report", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          type: form.elements.type.value,
          title,
          description,
          name: document.getElementById("name").value,
          email: document.getElementById("email").value,
          website: document.getElementById("website").value,
          browser: browserInfo(),
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Couldn't send your report.");
      form.hidden = true;
      document.getElementById("thanks").hidden = false;
    } catch (err) {
      msg.className = "msg error";
      msg.textContent = err.message;
      sendBtn.disabled = false;
    }
  });
</script>
</body>
</html>
