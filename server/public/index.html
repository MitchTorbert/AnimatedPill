<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Animated Pill Generator</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png" />
<style>
  @font-face {
    font-family: "RoobertTWITCH";
    src: url("/fonts/RoobertTWITCH-Medium.otf");
    font-weight: 500;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0e0e10;
    color: #efeff1;
    min-height: 100vh;
    padding: 40px 20px 80px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }

  .header { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 4px; }
  .header img { width: 32px; height: 32px; flex-shrink: 0; }
  h1 { font-size: 19px; margin: 0; text-align: center; }
  .sub { color: #adadb8; font-size: 13px; margin: 8px 0 44px; text-align: center; }

  .pill-list { display: flex; flex-direction: column; align-items: center; gap: 28px; }

  .pill-editor { position: relative; display: flex; align-items: center; gap: 14px; }
  .ambassador-toggle { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: #adadb8; cursor: pointer; white-space: nowrap; }
  .ambassador-toggle input { cursor: pointer; width: 20px; height: 20px; }
  .ambassador-toggle:hover { color: #dedee3; }

  .pill-shape {
    position: relative;
    display: flex;
    align-items: center;
    height: 100px;
    border-radius: 999px;
    padding: 0 46px;
    transition: background 0.15s ease;
  }
  .pill-shape input,
  .pill-hint {
    font-family: "RoobertTWITCH", sans-serif;
    font-weight: 500;
    font-size: 57px;
    /* A line-height tight to the font size (1) can clip a tall glyph like "/" in
       some browsers' native <input> text rendering, which doesn't always give a
       custom font's real ascent/descent the same room a plain <div> would -
       matching the pill's own full height instead gives it plenty of margin. */
    line-height: 100px;
  }
  .pill-shape input {
    height: 100px;
    border: none;
    outline: none;
    background: transparent;
    padding: 0;
    min-width: 4px;
  }
  .pill-shape input::placeholder { opacity: 0.45; }
  .pill-hint { pointer-events: none; white-space: nowrap; margin-left: 2px; }

  .color-picker-wrap { position: relative; flex-shrink: 0; }

  .color-circle {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.25);
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
  }
  .color-circle:hover { border-color: rgba(255,255,255,0.6); }

  .remove-pill {
    position: absolute;
    top: -10px;
    right: -10px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #26262b;
    border: 1px solid #3a3a3d;
    color: #adadb8;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .remove-pill:hover { border-color: #ff6b6b; color: #ff6b6b; }

  .color-popover {
    position: absolute;
    top: calc(100% + 12px);
    left: 0;
    width: 200px;
    background: #18181b;
    border: 1px solid #3a3a3d;
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5);
    z-index: 10;
  }
  .color-popover.open-upward { top: auto; bottom: calc(100% + 12px); }
  .color-popover[hidden] { display: none; }
  .popover-group { margin-bottom: 12px; }
  .popover-group:last-child { margin-bottom: 0; }
  .popover-group-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: #71717a; margin-bottom: 8px; }
  .popover-swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .popover-swatch {
    aspect-ratio: 1;
    border-radius: 6px;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .popover-swatch:hover { transform: scale(1.1); }
  .popover-swatch.selected { border-color: #ffffff; box-shadow: 0 0 0 2px #9146FF; }

  .add-pill {
    display: flex;
    align-items: center;
    gap: 10px;
    background: none;
    border: none;
    color: #dedee3;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    margin: 8px auto 0;
    padding: 8px;
  }
  .add-pill:hover { color: #9146FF; }
  .add-pill .plus-circle {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1.5px dashed #52525b;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    line-height: 1;
  }
  .add-pill:hover .plus-circle { border-color: #9146FF; border-style: solid; }

  .export-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-top: 56px;
  }

  .export-selects { display: flex; gap: 10px; }

  .pill-select {
    font-size: 14px;
    font-weight: 600;
    padding: 14px 40px 14px 22px;
    border-radius: 999px;
    border: 1px solid #3a3a3d;
    background: #18181b;
    color: #efeff1;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23adadb8'/></svg>");
    background-repeat: no-repeat;
    background-position: right 18px center;
  }

  .pill-select:disabled { opacity: 0.5; cursor: default; }

  .list-actions { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 8px auto 0; }
  .text-link-btn {
    background: none;
    border: none;
    color: #adadb8;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    padding: 8px;
  }
  .text-link-btn:hover { color: #ff6b6b; }

  .popover-rule-above { margin-top: 14px; padding-top: 12px; border-top: 1px solid #3a3a3d; }

  .popover-apply-all {
    display: block;
    width: 100%;
    background: none;
    border-left: none;
    border-right: none;
    border-bottom: none;
    color: #adadb8;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
  }
  .popover-apply-all:hover { color: #9146FF; }

  .popover-custom { display: flex; align-items: center; gap: 8px; }
  .popover-custom span { font-size: 12px; font-weight: 600; color: #71717a; white-space: nowrap; }
  .popover-custom input {
    flex: 1;
    min-width: 0;
    background: #0e0e10;
    border: 1px solid #3a3a3d;
    border-radius: 6px;
    color: #efeff1;
    font-size: 13px;
    padding: 6px 8px;
    font-family: monospace;
  }
  .popover-custom input:focus { outline: none; border-color: #9146FF; }
  .popover-custom input.invalid { border-color: #ff6b6b; }

  button.download {
    padding: 15px 28px;
    font-size: 15px;
    font-weight: 700;
    border-radius: 999px;
    border: none;
    background: #9146FF;
    color: white;
    cursor: pointer;
    white-space: nowrap;
  }
  button.download:disabled { opacity: 0.6; cursor: default; }
  button.download:hover:not(:disabled) { background: #7d2eff; }

  .status { margin-top: 16px; font-size: 14px; color: #adadb8; text-align: right; min-height: 20px; }
  .status.error { color: #ff6b6b; }
  .status.success { color: #63e6be; }

  .server-status { font-size: 13px; color: #f0b429; text-align: right; margin-bottom: 8px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <img src="/assets/glitch_3d.png" alt="Twitch" />
      <h1>Animated Pill Generator</h1>
    </div>
    <div class="sub">Type a username, pick a color, download RGB+alpha .mov files.</div>

    <div class="pill-list" id="pillList"></div>

    <button class="add-pill" id="addPillBtn">
      <span class="plus-circle">+</span>
      Add pill
    </button>

    <div class="list-actions">
      <button class="text-link-btn" id="clearAllBtn">Clear all</button>
    </div>

    <div class="server-status" id="serverStatus" hidden>⏳ Someone else is exporting right now - yours will start right after</div>
    <div class="export-row">
      <div class="export-selects">
        <select id="exportScale" class="pill-select">
          <option value="0.3">30%</option>
          <option value="0.35">35%</option>
          <option value="0.5">50%</option>
          <option value="1">Full resolution</option>
        </select>
        <select id="exportFps" class="pill-select">
          <option value="23.976">23.98 fps</option>
          <option value="30" selected>30 fps</option>
          <option value="60">60 fps</option>
        </select>
        <select id="exportFileType" class="pill-select">
          <option value="mov" selected>.mov</option>
          <option value="gif">.gif (alpha)</option>
        </select>
      </div>
      <button class="download" id="downloadBtn">Download (1 pill)</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <!-- hidden measurer used to auto-size each pill input as you type -->
  <span id="measurer" style="position:absolute; visibility:hidden; white-space:pre; font-family:'RoobertTWITCH', sans-serif; font-weight:500; font-size:57px;"></span>

<script>
  let colorGroups = []; // [{label, colors:[{name,hex}]}]
  let colors = []; // flat, for lookups

  let pills = [{ id: 1, username: "/", colorHex: null, ambassador: false }];
  let nextId = 2;
  let openPopoverId = null;

  function contrastTextColor(hex) {
    const c = hex.replace("#", "");
    const r = parseInt(c.substring(0, 2), 16) / 255;
    const g = parseInt(c.substring(2, 4), 16) / 255;
    const b = parseInt(c.substring(4, 6), 16) / 255;
    const lin = (v) => (v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
    const lum = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
    return lum > 0.4 ? "#000000" : "#FFFFFF";
  }

  // Small cushion beyond the exact measured width - a hidden <span> and a real
  // <input> don't always rasterize text at identically the same width (kerning/
  // hinting can differ slightly), and an input even 1px too narrow for its own
  // content will horizontally clip/scroll it rather than just wrapping.
  const WIDTH_BUFFER = 6;

  function measureWidth(text) {
    const m = document.getElementById("measurer");
    m.textContent = text || "";
    return m.getBoundingClientRect().width;
  }

  function updateDownloadLabel() {
    const btn = document.getElementById("downloadBtn");
    btn.textContent = "Download (" + pills.length + " pill" + (pills.length === 1 ? "" : "s") + ")";
  }

  function closePopover() {
    if (openPopoverId === null) return;
    const el = document.querySelector('.color-popover[data-for="' + openPopoverId + '"]');
    if (el) el.hidden = true;
    openPopoverId = null;
  }

  function renderPopoverContent(container, pill) {
    container.innerHTML = "";
    colorGroups.forEach((group) => {
      if (group.colors.length === 0) return;
      const groupEl = document.createElement("div");
      groupEl.className = "popover-group";
      const labelEl = document.createElement("div");
      labelEl.className = "popover-group-label";
      labelEl.textContent = group.label;
      groupEl.appendChild(labelEl);
      const swatchesEl = document.createElement("div");
      swatchesEl.className = "popover-swatches";
      group.colors.forEach((c) => {
        const sw = document.createElement("div");
        sw.className = "popover-swatch" + (c.hex === pill.colorHex ? " selected" : "");
        sw.style.background = c.hex;
        sw.title = c.name + " " + c.hex;
        sw.addEventListener("click", () => {
          pill.colorHex = c.hex;
          closePopover();
          renderPillList();
        });
        swatchesEl.appendChild(sw);
      });
      groupEl.appendChild(swatchesEl);
      container.appendChild(groupEl);
    });

    // For the rare outside-initiative pill that needs a non-brand color.
    const customWrap = document.createElement("div");
    customWrap.className = "popover-custom popover-rule-above";
    const customLabel = document.createElement("span");
    customLabel.textContent = "Custom:";
    customWrap.appendChild(customLabel);
    const customInput = document.createElement("input");
    customInput.type = "text";
    customInput.placeholder = "#RRGGBB";
    customInput.maxLength = 7;
    const applyCustomHex = () => {
      let v = customInput.value.trim();
      if (!v.startsWith("#")) v = "#" + v;
      if (!/^#[0-9a-fA-F]{6}$/.test(v)) {
        customInput.classList.add("invalid");
        return;
      }
      pill.colorHex = v.toUpperCase();
      closePopover();
      renderPillList();
    };
    customInput.addEventListener("input", () => customInput.classList.remove("invalid"));
    customInput.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      e.preventDefault();
      applyCustomHex();
    });
    customWrap.appendChild(customInput);
    container.appendChild(customWrap);

    const applyAllBtn = document.createElement("button");
    applyAllBtn.className = "popover-apply-all popover-rule-above";
    applyAllBtn.textContent = "Apply this color to all pills";
    applyAllBtn.addEventListener("click", () => {
      pills.forEach((p) => { p.colorHex = pill.colorHex; });
      closePopover();
      renderPillList();
    });
    container.appendChild(applyAllBtn);
  }

  function renderPillList() {
    const list = document.getElementById("pillList");
    list.innerHTML = "";

    pills.forEach((pill) => {
      const editor = document.createElement("div");
      editor.className = "pill-editor";

      const shape = document.createElement("div");
      shape.className = "pill-shape";
      shape.style.background = pill.colorHex;

      // The leading "/" lives directly in the input's own value (not a fixed
      // decoration beside it) - normal, deletable text, since a pill occasionally
      // holds something other than a username and needs to drop the slash.
      const input = document.createElement("input");
      input.type = "text";
      input.value = pill.username;
      input.placeholder = "username";
      input.autocomplete = "off";
      input.spellcheck = false;
      input.dataset.pillId = pill.id;
      input.style.color = contrastTextColor(pill.colorHex);
      input.style.width = Math.max(20, measureWidth(pill.username || "username") + WIDTH_BUFFER) + "px";

      // Ghost hint: shows grayed-out "username" right after the slash, for a pill
      // that's still just "/" - not real placeholder text (the input already has
      // real "/" as its value, so the native placeholder attribute only shows on a
      // fully empty input), and not part of the value, so typing lands right after
      // the slash rather than after this hint.
      const hint = document.createElement("span");
      hint.className = "pill-hint";
      hint.textContent = "username";
      hint.style.color = contrastTextColor(pill.colorHex) === "#000000" ? "rgba(0,0,0,0.35)" : "rgba(255,255,255,0.4)";
      const updateHint = () => { hint.hidden = pill.username !== "/"; };
      updateHint();
      shape.appendChild(input);
      shape.appendChild(hint);
      shape.addEventListener("click", () => input.focus());
      editor.appendChild(shape);

      input.addEventListener("input", () => {
        pill.username = input.value;
        input.style.width = Math.max(20, measureWidth(input.value || "username") + WIDTH_BUFFER) + "px";
        updateHint();
      });
      input.addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;
        e.preventDefault();
        // Deferred so this keydown event finishes on the current input before it
        // gets torn down and rebuilt - rebuilding synchronously, from inside the
        // very input handling the event, is what caused stray/duplicated keystrokes.
        setTimeout(() => addPill(true), 0);
      });

      const colorPickerWrap = document.createElement("div");
      colorPickerWrap.className = "color-picker-wrap";

      const circle = document.createElement("button");
      circle.className = "color-circle";
      circle.style.background = pill.colorHex;
      circle.addEventListener("click", (e) => {
        e.stopPropagation();
        const isOpen = openPopoverId === pill.id;
        closePopover();
        if (!isOpen) {
          openPopoverId = pill.id;
          const pop = colorPickerWrap.querySelector(".color-popover");
          pop.hidden = false;
          const circleRect = circle.getBoundingClientRect();
          const popHeight = pop.getBoundingClientRect().height;
          const spaceBelow = window.innerHeight - circleRect.bottom;
          const spaceAbove = circleRect.top;
          const opensUpward = spaceBelow < popHeight + 12 && spaceAbove > spaceBelow;
          pop.classList.toggle("open-upward", opensUpward);
        }
      });
      colorPickerWrap.appendChild(circle);

      const popover = document.createElement("div");
      popover.className = "color-popover";
      popover.dataset.for = pill.id;
      popover.hidden = true;
      popover.addEventListener("click", (e) => e.stopPropagation());
      renderPopoverContent(popover, pill);
      colorPickerWrap.appendChild(popover);

      editor.appendChild(colorPickerWrap);

      const toggleLabel = document.createElement("label");
      toggleLabel.className = "ambassador-toggle";
      const toggleInput = document.createElement("input");
      toggleInput.type = "checkbox";
      toggleInput.checked = !!pill.ambassador;
      toggleInput.addEventListener("change", () => {
        pill.ambassador = toggleInput.checked;
      });
      toggleLabel.appendChild(toggleInput);
      toggleLabel.appendChild(document.createTextNode("Ambassador"));
      editor.appendChild(toggleLabel);

      if (pills.length > 1) {
        const removeBtn = document.createElement("button");
        removeBtn.className = "remove-pill";
        removeBtn.textContent = "✕";
        removeBtn.addEventListener("click", () => {
          pills = pills.filter((p) => p.id !== pill.id);
          renderPillList();
        });
        editor.appendChild(removeBtn);
      }

      list.appendChild(editor);
    });

    updateDownloadLabel();
  }

  document.addEventListener("click", () => closePopover());

  function addPill(focusAfter) {
    const lastColor = pills[pills.length - 1].colorHex;
    const newId = nextId++;
    pills.push({ id: newId, username: "/", colorHex: lastColor, ambassador: false });
    renderPillList();
    if (focusAfter) {
      const newInput = document.querySelector('input[data-pill-id="' + newId + '"]');
      if (newInput) {
        newInput.focus();
        newInput.setSelectionRange(newInput.value.length, newInput.value.length);
      }
    }
  }

  document.getElementById("addPillBtn").addEventListener("click", () => addPill(false));

  document.getElementById("clearAllBtn").addEventListener("click", () => {
    location.reload();
  });

  // One fps control, not two - GIF only supports 12.5fps (see server), so
  // selecting .gif swaps the same dropdown's own options down to that single
  // fixed value and disables it, instead of showing a second fps element.
  const MOV_FPS_OPTIONS = document.getElementById("exportFps").innerHTML;
  let lastMovFps = "30";
  document.getElementById("exportFileType").addEventListener("change", (e) => {
    const fpsSelect = document.getElementById("exportFps");
    if (e.target.value === "gif") {
      lastMovFps = fpsSelect.value;
      fpsSelect.innerHTML = '<option value="12.5" selected>12.5 fps</option>';
      fpsSelect.disabled = true;
    } else {
      fpsSelect.innerHTML = MOV_FPS_OPTIONS;
      fpsSelect.value = lastMovFps;
      fpsSelect.disabled = false;
    }
  });

  async function init() {
    const res = await fetch("/api/colors");
    colorGroups = await res.json();
    colors = colorGroups.flatMap((g) => g.colors);
    const defaultColor = colors.find((c) => c.name === "Black Ops") || colors[0];
    pills[0].colorHex = defaultColor.hex;
    // Wait for the real custom font before the very first width measurement -
    // otherwise that first measureWidth() call (for the initial "/") silently
    // falls back to a system font while RoobertTWITCH is still downloading,
    // sizing the input too narrow and clipping the glyph horizontally until
    // typing triggers a fresh (by-then-correct) measurement.
    await document.fonts.load('500 57px "RoobertTWITCH"').catch(() => {});
    renderPillList();
  }

  // Individual files package into one zip themselves once there are enough of
  // them that a pile of separate downloads gets unwieldy - below that, getting
  // each pill as its own plain file (no unzipping step) is more convenient.
  const ZIP_THRESHOLD = 4;

  function triggerDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  // Idle check: only matters (and only shown) while nobody has clicked Download
  // yet - once a render is in flight, renderRequestWithQueueStatus below takes
  // over the same #status line with the requester's own position instead.
  async function pollIdleServerStatus() {
    const el = document.getElementById("serverStatus");
    if (document.getElementById("downloadBtn").disabled) return; // a render is active, not idle
    try {
      const res = await fetch("/api/status");
      const data = await res.json();
      el.hidden = !data.busy;
    } catch (e) {
      el.hidden = true;
    }
  }
  pollIdleServerStatus();
  setInterval(pollIdleServerStatus, 10000);

  // Wraps one render request with polling of its own queue position, so
  // "Rendering..." only shows once this request is the one actually running -
  // while something else is still ahead of it, it says so instead.
  async function renderRequestWithQueueStatus(pills, scale, fps, fileType, setStatusText, renderingText) {
    let settled = false;
    const checkQueue = async () => {
      if (settled) return;
      try {
        const res = await fetch("/api/status");
        const data = await res.json();
        if (settled) return;
        const aheadOfMe = Math.max(0, data.queueLength - 1);
        setStatusText(
          aheadOfMe === 0
            ? renderingText
            : aheadOfMe === 1
            ? "You're next in line - waiting for the current export to finish..."
            : "Queued behind " + aheadOfMe + " exports - yours will start automatically..."
        );
      } catch (e) {
        // A status hiccup shouldn't disrupt the actual render - just leave
        // whatever text was already showing.
      }
    };
    setStatusText(renderingText); // optimistic - corrected within one poll if actually queued
    document.getElementById("serverStatus").hidden = true; // the active status line takes over now
    const interval = setInterval(checkQueue, 3000);
    try {
      const resultPromise = renderRequest(pills, scale, fps, fileType);
      await checkQueue();
      return await resultPromise;
    } finally {
      settled = true;
      clearInterval(interval);
    }
  }

  async function renderRequest(pills, scale, fps, fileType) {
    const res = await fetch("/api/render", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pills, scale, fps, fileType }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || "Render failed");
    }
    const blob = await res.blob();
    const disposition = res.headers.get("Content-Disposition") || "";
    const match = disposition.match(/filename="(.+)"/);
    return { blob, filename: match ? match[1] : null };
  }

  document.getElementById("downloadBtn").addEventListener("click", async () => {
    const status = document.getElementById("status");
    const btn = document.getElementById("downloadBtn");
    const scale = parseFloat(document.getElementById("exportScale").value);
    const fileType = document.getElementById("exportFileType").value;
    const fps = fileType === "gif" ? 12.5 : parseFloat(document.getElementById("exportFps").value);

    const cleaned = pills.map((p) => ({
      username: p.username.trim(),
      colorHex: p.colorHex,
      ambassador: !!p.ambassador,
    }));

    if (cleaned.some((p) => !p.username)) {
      status.textContent = "Every pill needs a username.";
      status.className = "status error";
      return;
    }

    btn.disabled = true;
    status.className = "status";

    try {
      if (cleaned.length >= ZIP_THRESHOLD) {
        const renderingText = "Rendering " + cleaned.length + " pills, one at a time (~10-15s each)...";
        const { blob, filename } = await renderRequestWithQueueStatus(
          cleaned, scale, fps, fileType,
          (text) => { status.textContent = text; },
          renderingText
        );
        const fallback = cleaned.length + " Pills " + cleaned[0].username + ".zip";
        triggerDownload(blob, filename || fallback);
        status.textContent = "Downloaded " + (filename || fallback);
      } else {
        // Each pill is its own request/response/download - a plain file per
        // pill, no zip step, for the common small-batch case.
        for (let i = 0; i < cleaned.length; i++) {
          const renderingText = cleaned.length > 1
            ? "Rendering pill " + (i + 1) + " of " + cleaned.length + "..."
            : "Rendering... this can take 10-30 seconds.";
          const pill = cleaned[i];
          const { blob, filename } = await renderRequestWithQueueStatus(
            [pill], scale, fps, fileType,
            (text) => { status.textContent = text; },
            renderingText
          );
          const fallback = pill.username + " Pill." + fileType;
          triggerDownload(blob, filename || fallback);
          // A small gap between triggered downloads - firing several a.click()
          // downloads back to back in the same tick is what makes browsers
          // treat them as popup-style spam and block the later ones.
          if (i < cleaned.length - 1) await new Promise((r) => setTimeout(r, 400));
        }
        status.textContent = cleaned.length > 1
          ? "Downloaded " + cleaned.length + " files"
          : "Downloaded " + (cleaned[0].username + " Pill." + fileType);
      }
      status.className = "status success";
    } catch (err) {
      status.textContent = err.message || "Something went wrong.";
      status.className = "status error";
    } finally {
      btn.disabled = false;
    }
  });

  init();
</script>
</body>
</html>
